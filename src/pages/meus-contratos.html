  Descricao: Tela com os contratos do usuario: pendentes de assinatura e historico de contratos assinados

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Contratos - AlugaMáquina</title>
  <link rel="icon" type="image/jpeg" href="../../assets/ico-AlugaMaquina.jpg" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/meus-contratos.css" />
</head>
<body>
  <!-- Cabeçalho -->
  <header class="header">
    <div class="container header-inner">
      <a href="busca-catalogo.html" class="brand">
        <img src="../../assets/logo-header.png" alt="AlugaMáquina" class="brand-logo" />
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="busca-catalogo.html" class="nav-link">Catálogo</a></li>
          <li><a href="cadastro-maquina.html" class="nav-link">Cadastrar Máquina</a></li>
          <li><a href="chat.html" class="nav-link">Mensagens</a></li>
          <li><a href="avaliacao-pos-locacao.html" class="nav-link">Minhas Locações</a></li>
          <li><a href="meus-contratos.html" class="nav-link active">Meus Contratos</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">
    <section class="page-intro">
      <h1 class="page-title">Meus Contratos</h1>
      <p class="page-description">Veja os contratos que aguardam assinatura e o histórico dos contratos já assinados.</p>
    </section>

    <p id="avisoContratos" class="aviso" role="status" aria-live="polite" hidden></p>

    <!-- Abas -->
    <div class="abas" role="tablist" aria-label="Tipo de contrato">
      <button type="button" class="aba ativa" id="abaPendentes" role="tab" aria-selected="true" aria-controls="listaPendentes">
        Pendentes <span class="contador" id="contadorPendentes">0</span>
      </button>
      <button type="button" class="aba" id="abaHistorico" role="tab" aria-selected="false" aria-controls="listaHistorico">
        Histórico <span class="contador" id="contadorHistorico">0</span>
      </button>
    </div>

    <section id="listaPendentes" class="lista-contratos" role="tabpanel" aria-labelledby="abaPendentes">
      <p class="carregando">Carregando seus contratos...</p>
    </section>

    <section id="listaHistorico" class="lista-contratos" role="tabpanel" aria-labelledby="abaHistorico" hidden></section>
  </main>

  <!-- Rodapé -->
  <footer class="footer">
    <div class="container footer-inner">
      <span>AlugaMáquina - Plataforma de Locação de Máquinas e Equipamentos</span>
    </div>
  </footer>

  <script src="../js/auth-guard.js"></script>
  <script src="../js/meus-contratos.js"></script>
</body>
</html>
