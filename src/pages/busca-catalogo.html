  Descricao: Tela de busca e filtro regional (vitrine / catalogo de maquinas) - prototipo visual
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo - AlugaMáquina</title>
  <link rel="icon" type="image/jpeg" href="../../assets/ico-AlugaMaquina.jpg" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/busca-catalogo.css" />
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <div class="container header-inner">
      <a href="busca-catalogo.html" class="brand">
        <img src="../../assets/logo-header.png" alt="AlugaMáquina" class="brand-logo" />
      </a>

      <nav>
        <ul class="nav-menu">
          <li><a href="busca-catalogo.html" class="nav-link active">Catálogo</a></li>
          <li><a href="cadastro-maquina.html" class="nav-link">Cadastrar Máquina</a></li>
          <li><a href="chat.html" class="nav-link">Mensagens</a></li>
          <li><a href="avaliacao-pos-locacao.html" class="nav-link">Minhas Locações</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">

    <section class="page-intro">
      <h1 class="page-title">Encontre máquinas perto de você</h1>
      <p class="page-description">Filtre por distância e economize no frete. Base de referência: Paulínia / SP.</p>
    </section>

    <!-- Busca e filtros -->
    <section class="search-panel">
      <div class="form-group search-bar">
        <label for="busca" class="form-label">Buscar equipamento</label>
        <input type="search" id="busca" class="form-input" autocomplete="off" placeholder="Ex.: colheitadeira, John Deere, trator 4x4..." />
      </div>

      <div class="filters">
        <div class="form-group">
          <label for="raio" class="form-label">Distância máxima</label>
          <select id="raio" class="form-select" autocomplete="off">
            <option value="25">Até 25 km</option>
            <option value="50">Até 50 km</option>
            <option value="100" selected>Até 100 km</option>
            <option value="9999">Qualquer distância</option>
          </select>
        </div>

        <div class="form-group">
          <label for="categoria" class="form-label">Categoria</label>
          <select id="categoria" class="form-select" autocomplete="off">
            <option value="">Todas</option>
            <option value="tratores">Tratores</option>
            <option value="colheitadeiras">Colheitadeiras</option>
            <option value="implementos">Implementos</option>
            <option value="pulverizadores">Pulverizadores</option>
            <option value="plantadeiras">Plantadeiras</option>
          </select>
        </div>

        <div class="form-group">
          <label for="valor" class="form-label">Valor da diária</label>
          <select id="valor" class="form-select" autocomplete="off">
            <option value="9999999">Qualquer valor</option>
            <option value="300">Até R$ 300</option>
            <option value="800">Até R$ 800</option>
            <option value="1500">Até R$ 1.500</option>
            <option value="2500">Até R$ 2.500</option>
          </select>
        </div>

        <div class="form-group filters-action">
          <button type="button" id="limpar" class="btn btn-secondary">Limpar filtros</button>
        </div>
      </div>
    </section>

    <p id="contagem" class="result-count">Carregando máquinas...</p>

    <!-- Grade de cards: preenchida via busca-catalogo.js (GET /api/maquinas/busca) -->
    <section id="grade" class="card-grid"></section>

  </main>

  <!-- Rodapé -->
  <footer class="footer">
    <div class="container footer-inner">
      <span>AlugaMáquina - Plataforma de Locação de Máquinas e Equipamentos</span>
    </div>
  </footer>

  <script src="../js/auth-guard.js"></script>
  <script src="../js/busca-catalogo.js"></script>
</body>
</html>
