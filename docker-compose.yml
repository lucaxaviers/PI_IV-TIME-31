services:
  mongodb:
    image: mongo:7
    container_name: alugamaquina-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: alugamaquina
    volumes:
      - alugamaquina_mongo_data:/data/db
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/01-init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  alugamaquina_mongo_data:
    name: alugamaquina_mongo_data
